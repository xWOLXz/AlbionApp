<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1." />
  <title>Albion Market PWA</title>
  <meta name="theme-color" content="#f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Albion Market</h1>
    <p>Arbitraje entre ciudades para revender con ganancia</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Configuración</h2>

      <label for="searchInput">Buscar item</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Ejemplo: Bolsa T4 o T4_BAG"
      />

      <label for="buyCityFilter">Ciudad de compra</label>
      <select id="buyCityFilter">
        <option value="">Cualquiera</option>
      </select>

      <label for="sellCityFilter">Ciudad de venta</label>
      <select id="sellCityFilter">
        <option value="">Cualquiera</option>
      </select>

      <label for="minProfitInput">Ganancia mínima neta</label>
      <input type="number" id="minProfitInput" value="100" />

      <label for="taxInput">Impuesto de venta (%)</label>
      <input type="number" id="taxInput" value="6.5" step=".1" />

      <label for="batchSizeInput">Cantidad por lote</label>
      <input type="number" id="batchSizeInput" value="30" min="10" max="100" />

      <div class="actions">
        <button id="loadItemsBtn">Cargar items</button>
        <button id="scanAllBtn">Escanear todos</button>
        <button id="scanFilteredBtn">Escanear filtrados</button>
      </div>

      <p class="small">
        Consejo: en Android usa lotes de 20 a 40 items para que vaya fluido.
      </p>
    </section>

    <section class="card">
      <h2>Estado</h2>
      <div id="status">Esperando...</div>
      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
    </section>

    <section class="card">
      <h2>Items cargados</h2>
      <div id="itemsCount"> items cargados</div>
      <div id="itemsPreview" class="items-preview"></div>
    </section>

    <section class="card">
      <h2>Oportunidades</h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
